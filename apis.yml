X-Provenance:
  - date: '2026-08-13'
    surface: OpenAPI
    url: https://api2.isbndb.com/doc.json
    http_status: 200
    action: re-harvested
    note: >-
      ISBNdb wrote in asking us to update the Postman collection: it documented a
      dewey_decimal field they do not have, and its sample responses were generated
      placeholders. Both correct. Re-harvested their live spec, which their own docs
      link as the specification of record. Their current spec and the copy we held are
      BOTH labelled version 2.7.0 with the same 16 paths, but theirs has dropped
      dewey_decimal and added 7 filter schemas — the version string did not change, so
      nothing downstream could detect the revision. dewey_decimal removed from the
      OpenAPIs, collections, JSON Schema, JSON-LD context, vocabulary and examples.
      Placeholder responses persist because their spec carries exactly one `example`
      and zero `examples`; that fix belongs upstream.
